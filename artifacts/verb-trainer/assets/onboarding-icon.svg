<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Light rounded-square background like the screenshot -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F7FF"/>
      <stop offset="50%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#81D4FA"/>
    </linearGradient>
    <!-- Wave gradient -->
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="40%" stop-color="#039BE5"/>
      <stop offset="100%" stop-color="#29B6F6"/>
    </linearGradient>
    <!-- Soft shadow under the icon for depth -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#0D47A1" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Squircle background with shadow -->
  <rect x="64" y="64" width="896" height="896" rx="240" fill="url(#bg)" filter="url(#softShadow)"/>

  <!-- Subtle vignette/highlight on the background for a premium feel -->
  <circle cx="320" cy="280" r="280" fill="white" opacity="0.25"/>

  <!-- Open book at the bottom, white with soft shadows -->
  <g transform="translate(512, 720)">
    <!-- Book shadow/base -->
    <path d="M-240 8 C-110 -20 0 -20 0 -20 C0 -20 110 -20 240 8 L240 48 C110 20 0 20 0 20 C0 20 -110 20 -240 48 Z" fill="#90A4AE"/>
    <!-- Left cover -->
    <path d="M-240 8 C-110 -20 0 -20 0 -20 L0 48 C-110 48 -240 76 -240 76 Z" fill="white"/>
    <!-- Right cover -->
    <path d="M240 8 C110 -20 0 -20 0 -20 L0 48 C110 48 240 76 240 76 Z" fill="white"/>
    <!-- Left pages -->
    <path d="M-230 16 C-110 -6 -8 -6 -8 -6 L-8 38 C-110 38 -230 60 -230 60 Z" fill="#E1F5FE"/>
    <!-- Right pages -->
    <path d="M230 16 C110 -6 8 -6 8 -6 L8 38 C110 38 230 60 230 60 Z" fill="#E1F5FE"/>
    <!-- Center crease -->
    <line x1="0" y1="-20" x2="0" y2="70" stroke="#B3E5FC" stroke-width="5"/>
  </g>

  <!-- Wave rising from the book -->
  <g transform="translate(512, 420)">
    <!-- Main wave body -->
    <path d="M-200 160
             C-200 160 -150 -30 0 -90
             C130 -140 260 -60 240 80
             C230 150 140 210 60 210
             C-40 210 -120 150 -140 190
             C-160 220 -220 190 -200 160
             Z" fill="url(#wave)"/>
    <!-- White foam crest -->
    <path d="M-100 120
             C-60 10 40 -50 120 -50
             C200 -50 250 0 230 60
             C210 100 140 120 70 120
             C10 120 -70 70 -100 120 Z" fill="white" opacity="0.28"/>
    <!-- Foam drops -->
    <circle cx="170" cy="-100" r="18" fill="white" opacity="0.95"/>
    <circle cx="210" cy="-70" r="13" fill="white" opacity="0.9"/>
    <circle cx="130" cy="-110" r="10" fill="white" opacity="0.85"/>
    <circle cx="-60" cy="70" r="12" fill="white" opacity="0.8"/>
    <circle cx="-20" cy="100" r="8" fill="white" opacity="0.75"/>
    <circle cx="250" cy="30" r="9" fill="white" opacity="0.8"/>
  </g>
</svg>