<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1A3A"/>
      <stop offset="100%" stop-color="#162447"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <!-- Open book -->
  <g transform="translate(512, 720)">
    <!-- Book spine/shadow -->
    <path d="M-260 0 C-120 -28 0 -28 0 -28 C0 -28 120 -28 260 0 L260 36 C120 8 0 8 0 8 C0 8 -120 8 -260 36 Z" fill="#475569"/>
    <!-- Left cover -->
    <path d="M-260 0 C-120 -28 0 -28 0 -28 L0 36 C-120 36 -260 64 -260 64 Z" fill="url(#book)"/>
    <!-- Right cover -->
    <path d="M260 0 C120 -28 0 -28 0 -28 L0 36 C120 36 260 64 260 64 Z" fill="url(#book)"/>
    <!-- Left pages -->
    <path d="M-250 6 C-120 -18 -10 -18 -10 -18 L-10 26 C-120 26 -250 50 -250 50 Z" fill="#F8FAFC"/>
    <!-- Right pages -->
    <path d="M250 6 C120 -18 10 -18 10 -18 L10 26 C120 26 250 50 250 50 Z" fill="#F8FAFC"/>
    <!-- Center crease -->
    <line x1="0" y1="-28" x2="0" y2="64" stroke="#CBD5E1" stroke-width="4"/>
  </g>
  <!-- Wave -->
  <g transform="translate(512, 420)" filter="url(#glow)">
    <!-- Main wave body -->
    <path d="M-220 140
             C-220 140 -160 -60 0 -120
             C140 -170 280 -80 260 80
             C250 160 160 220 80 220
             C-20 220 -120 160 -140 200
             C-160 230 -240 200 -220 140
             Z" fill="url(#wave)"/>
    <!-- Wave crest highlight -->
    <path d="M-120 100
             C-80 -20 20 -80 100 -80
             C180 -80 240 -20 220 40
             C200 90 140 110 80 110
             C20 110 -80 60 -120 100 Z" fill="rgba(255,255,255,0.25)"/>
    <!-- Foam drops -->
    <circle cx="160" cy="-100" r="16" fill="white" opacity="0.9"/>
    <circle cx="200" cy="-70" r="11" fill="white" opacity="0.85"/>
    <circle cx="120" cy="-110" r="9" fill="white" opacity="0.8"/>
    <circle cx="-80" cy="50" r="10" fill="white" opacity="0.7"/>
    <circle cx="-40" cy="80" r="7" fill="white" opacity="0.65"/>
    <circle cx="240" cy="20" r="8" fill="white" opacity="0.7"/>
  </g>
</svg>